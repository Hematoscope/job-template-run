apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "job-template-run.fullname" . }}-controller
  labels:
    app.kubernetes.io/name: {{ include "job-template-run.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "job-template-run.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "job-template-run.name" . }}
        app.kubernetes.io/name: {{ include "job-template-run.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.Version }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      serviceAccountName: {{ include "job-template-run.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - "kopf"
            - "run"
            - "--liveness=http://0.0.0.0:8080/healthz"
            - "--standalone"
            - "--all-namespaces"
            - "--verbose"
            - "/app/controller.py"
          env:
            - name: APP_NAME
              value: {{ include "job-template-run.name" . }}
            - name: APP_INSTANCE
              value: {{ .Release.Name }}
            - name: APP_VERSION
              value: {{ .Chart.Version }}
            - name: APP_MANAGED_BY
              value: {{ .Release.Service }}
            - name: TIMER_INTERVAL
              value: "{{ .Values.timerInterval }}"
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
