{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "job-template-run.fullname" . }}-role
  labels:
    app.kubernetes.io/name: {{ include "job-template-run.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "patch", "get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["cellbytes.io"]
    resources: ["jobruns"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["cellbytes.io"]
    resources: ["jobruns/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["cellbytes.io"]
    resources: ["jobtemplates"]
    verbs: ["get"]
{{- if .Values.rbac.allowCallbackTokenSecrets }}
  # Needed only for JobRuns that use spec.callbackTokenSecretRef: the
  # controller reads the referenced Secret at callback-delivery time. This
  # grants cluster-wide read access to Secrets, so it is opt-in.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
{{- end }}
